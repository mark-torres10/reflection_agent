[project]
name = "reflection-agent"
version = "0.1.0"
description = "Reflection agent — Streamlit app with LangChain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
exclude-newer = "7 days"
